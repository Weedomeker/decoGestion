services:
  redis:
    image: redis:7-alpine
    ports:
      # Sans mot de passe : accessible uniquement depuis le poste, pas depuis le réseau.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis_data:
